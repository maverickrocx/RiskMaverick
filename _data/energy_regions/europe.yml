name: Europe
slug: europe
status: live
order: 1
reviewed: 2026-11-13
data_vintage: "2026 year-to-date prices and storage to mid-November 2026; 2025 full-year structural data from ACER."
blurb: >-
  Europe prices gas off the Dutch TTF and the UK NBP, and power zone by zone.
  The spreads between those points — not any single price — drive cargo
  economics, plant dispatch and hedge design.
marks_note: >-
  Country marks below are 2026 year-to-date averages to mid-November (gas:
  November month to date), shown for scale rather than as live prices.
  Volatilities are illustrative. Live benchmarks are on the Tools page.

countries:
  - country: Netherlands
    code: NL
    role: Europe's gas pricing anchor
    gas_hub: TTF
    gas_venue: ICE ENDEX / EEX
    gas_mark: 89
    gas_vol: 4.0
    power_zone: Dutch baseload
    power_venue: EPEX / ICE ENDEX
    power_mark: 120
    power_vol: 3.6
    note: >-
      The TTF is the continent's benchmark — a virtual hub deep enough that
      European and Asian LNG cargoes are priced against it. Dutch power is
      tightly coupled to German power through interconnection.

  - country: United Kingdom
    code: UK
    role: Separate gas hub, coupled power
    gas_hub: NBP
    gas_venue: ICE
    gas_mark: 85
    gas_vol: 4.2
    power_zone: UK baseload
    power_venue: ICE / EPEX
    power_mark: 127
    power_vol: 3.7
    note: >-
      The NBP trades at a basis to TTF that widens with LNG arrivals and
      interconnector flows. Post-Brexit the GB power market sits outside EU
      day-ahead coupling, so IFA/BritNed flows set the UK–NL spread.

  - country: Germany
    code: DE
    role: Largest power market
    gas_hub: THE (traded off TTF)
    gas_venue: EEX
    gas_mark: 89
    gas_vol: 4.0
    power_zone: German baseload
    power_venue: EEX / EPEX
    power_mark: 120
    power_vol: 3.5
    note: >-
      Europe's biggest and most liquid power curve, and the reference for
      Central-European hedging. High wind and solar share makes it the market
      where shape and negative-price risk bite hardest.

  - country: France
    code: FR
    role: Nuclear-led, weather-exposed
    gas_hub: PEG (traded off TTF)
    gas_venue: EEX
    gas_mark: 89
    gas_vol: 4.1
    power_zone: French baseload
    power_venue: EPEX
    power_mark: 96
    power_vol: 3.8
    note: >-
      A large nuclear fleet usually keeps French power below German, so the
      German–French spread is a core Continental position — but it inverts on
      nuclear availability and cold snaps.

cross_cutting:
  - name: EUA carbon
    detail: EU ETS allowance — about €90/t in November 2026 (EEX auctions)
    note: Feeds every thermal plant's clean spark and dark spread.
  - name: API2 coal
    detail: ARA delivered coal — no free price feed; check a licensed source
    note: Sets the coal-vs-gas switching economics in the merit order.

basis:
  - pair: TTF – NBP
    kind: Gas location
    level: "≈ €4/MWh"
    vol: 3.0
    note: Widens with LNG arrivals and interconnector direction.
  - pair: German – French power
    kind: Power location
    level: "€24/MWh (2026 YTD)"
    vol: 4.5
    note: Driven by French nuclear availability; the largest basis exposure here.
  - pair: German – Dutch power
    kind: Power location
    level: "≈ €0/MWh (2026 YTD)"
    vol: 4.0
    note: Tight coupling — small spread, but sizeable position.
  - pair: UK – NL power
    kind: Interconnector
    level: "≈ €7/MWh (2026 YTD)"
    vol: 5.0
    note: Set by IFA / BritNed flows and GB scarcity pricing.

correlations:
  note: >-
    Indicative daily-return correlations. The pairs that look "safe" to
    cross-hedge are exactly the ones to check — TTF/NBP at 0.85 still leaves
    material basis risk on a large book.
  pairs:
    - { a: TTF, b: NBP, v: 0.85 }
    - { a: German power, b: Dutch power, v: 0.85 }
    - { a: German power, b: French power, v: 0.75 }
    - { a: TTF, b: German power, v: 0.60 }
    - { a: TTF, b: EUA, v: 0.25 }

trend:
  title: TTF gas — period averages
  unit: €/MWh
  caption: >-
    Period averages, not a continuous series. After two calm years, 2026
    turned on the Middle East war: QatarEnergy's force majeure from March cut
    about a fifth of global LNG, and TTF climbed from the low €30s in January
    to near €90 by October, its highest since 2022. For scale, TTF hit an
    all-time record near €342/MWh in August 2022.
  points:
    - { label: "2023 avg", value: 41, source: ACER }
    - { label: "2024 avg", value: 34, source: ICE Endex }
    - { label: "2025 avg", value: 36, source: ICE Endex }
    - { label: "Q1 2026", value: 40, source: ICE Endex }
    - { label: "Jun 2026", value: 45, source: ICE Endex }
    - { label: "Sep 2026", value: 75, source: ICE Endex }
    - { label: "Oct 2026", value: 87, source: ICE Endex }
    - { label: "Nov 2026 MTD", value: 89, source: ICE Endex }

context:
  - stat: "71%"
    label: EU gas storage on 11 November 2026, against 82% a year earlier and about 93% on average in 2022–25
    source: GIE AGSI+
  - stat: "≈ 1/5"
    label: Share of global LNG supply shut in by QatarEnergy's force majeure at its peak; loadings were back to about half by November
    source: Bloomberg
  - stat: "€90+"
    label: TTF in October 2026, the first time above €90/MWh since late 2022
    source: Bloomberg
  - stat: "+37%"
    label: German day-ahead power, 2026 to mid-November against the same period of 2025
    source: Energy-Charts
  - stat: "1 Jan 2027"
    label: EU ban on Russian LNG under long-term contracts takes effect
    source: Council of the EU
  - stat: "50%"
    label: Renewables share of EU electricity generation in 2025
    source: ACER 2025

sources:
