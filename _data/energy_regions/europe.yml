  - { title: "Asian LNG prices jump to highest since 2022 on tanker strikes", publisher: "Bloomberg", url: "https://www.bloomberg.com/news/articles/2026-10-20/asian-lng-prices-jump-to-highest-since-2022-on-tanker-strikes" }
