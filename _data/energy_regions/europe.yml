name: Europe
slug: europe
status: live
order: 1
reviewed: 2026-07-28
data_vintage: "Market structure and 2025 full-year data; price series to June 2026."
blurb: >-
  Europe prices gas off the Dutch TTF and the UK NBP, and power zone by zone.
  The spreads between those points — not any single price — drive cargo
  economics, plant dispatch and hedge design.
marks_note: >-
  Country marks below are indicative levels used for illustration (book date
  14 Jul 2026), not live prices. Live benchmarks are on the Tools page.

countries:
  - country: Netherlands
    code: NL
    role: Europe's gas pricing anchor
    gas_hub: TTF
    gas_venue: ICE ENDEX / EEX
    gas_mark: 32
    gas_vol: 4.0
    power_zone: Dutch baseload
    power_venue: EPEX / ICE ENDEX
    power_mark: 88
    power_vol: 3.6
    note: >-
      The TTF is the continent's benchmark — a virtual hub deep enough that
      European and Asian LNG cargoes are priced against it. Dutch power is
      tightly coupled to German power through interconnection.

  - country: United Kingdom
    code: UK
    role: Separate gas hub, coupled power
    gas_hub: NBP
    gas_venue: ICE
    gas_mark: 30
    gas_vol: 4.2
    power_zone: UK baseload
    power_venue: ICE / EPEX
    power_mark: 88
    power_vol: 3.7
    note: >-
      The NBP trades at a basis to TTF that widens with LNG arrivals and
      interconnector flows. Post-Brexit the GB power market sits outside EU
      day-ahead coupling, so IFA/BritNed flows set the UK–NL spread.

  - country: Germany
    code: DE
    role: Largest power market
    gas_hub: THE (traded off TTF)
    gas_venue: EEX
    gas_mark: 33
    gas_vol: 4.0
    power_zone: German baseload
    power_venue: EEX / EPEX
    power_mark: 85
    power_vol: 3.5
    note: >-
      Europe's biggest and most liquid power curve, and the reference for
      Central-European hedging. High wind and solar share makes it the market
      where shape and negative-price risk bite hardest.

  - country: France
    code: FR
    role: Nuclear-led, weather-exposed
    gas_hub: PEG (traded off TTF)
    gas_venue: EEX
    gas_mark: 33
    gas_vol: 4.1
    power_zone: French baseload
    power_venue: EPEX
    power_mark: 70
    power_vol: 3.8
    note: >-
      A large nuclear fleet usually keeps French power below German, so the
      German–French spread is a core Continental position — but it inverts on
      nuclear availability and cold snaps.

cross_cutting:
  - name: EUA carbon
    detail: EU ETS allowance — €70/t indicative, 2.5% daily vol
    note: Feeds every thermal plant's clean spark and dark spread.
  - name: API2 coal
    detail: ARA delivered coal — €110/t indicative, 2.0% daily vol
    note: Sets the coal-vs-gas switching economics in the merit order.

basis:
  - pair: TTF – NBP
    kind: Gas location
    level: "€2/MWh"
    vol: 3.0
    note: Widens with LNG arrivals and interconnector direction.
  - pair: German – French power
    kind: Power location
    level: "€15/MWh"
    vol: 4.5
    note: Driven by French nuclear availability; the largest basis exposure here.
  - pair: German – Dutch power
    kind: Power location
    level: "−€3/MWh"
    vol: 4.0
    note: Tight coupling — small spread, but sizeable position.
  - pair: UK – NL power
    kind: Interconnector
    level: "€5/MWh"
    vol: 5.0
    note: Set by IFA / BritNed flows and GB scarcity pricing.

correlations:
  note: >-
    Indicative daily-return correlations. The pairs that look "safe" to
    cross-hedge are exactly the ones to check — TTF/NBP at 0.85 still leaves
    material basis risk on a large book.
  pairs:
    - { a: TTF, b: NBP, v: 0.85 }
    - { a: German power, b: Dutch power, v: 0.85 }
    - { a: German power, b: French power, v: 0.75 }
    - { a: TTF, b: German power, v: 0.60 }
    - { a: TTF, b: EUA, v: 0.25 }

trend:
  title: TTF gas — period averages
  unit: €/MWh
  caption: >-
    Published period averages, not a continuous series. The path runs from
    post-crisis normalisation through 2024–25 into a tighter 2026, as colder
    weather, faster storage withdrawals and Middle East supply disruption
    re-tightened the balance. For scale, TTF hit an all-time record near
    €342/MWh in August 2022 — roughly 15× the pre-crisis norm of about €20.
  points:
    - { label: "2023 avg", value: 41, source: ACER }
    - { label: "2024 avg", value: 34, source: Market }
    - { label: "2025 avg", value: 36, source: Market }
    - { label: "Q1 2026", value: 40, source: Market }
    - { label: "Jun 2026", value: 45, source: Market }

context:
  - stat: "50%"
    label: Renewables share of EU electricity generation in 2025 — solar set records and overtook coal for the first time
    source: ACER 2025
  - stat: "−162 TWh"
    label: Fall in EU reliance on Russian gas during 2025, largely replaced by LNG
    source: ACER 2025
  - stat: "50 / 40 / 10"
    label: 2025 EU gas supply mix — % pipeline, LNG (mostly US) and domestic
    source: ACER 2025
  - stat: "62%"
    label: EU gas storage at end-2025, ten points below the previous year after heavy winter withdrawals
    source: ACER 2025
  - stat: "~5×"
    label: Daily wholesale power price swings versus 2020 — the flexibility gap, in one number
    source: ACER 2025
  - stat: "+70 TWh/mo"
    label: Growth in global LNG capacity, with supply by 2030 expected to reach twice current EU imports
    source: ACER 2025

