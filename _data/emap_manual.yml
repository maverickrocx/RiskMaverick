# scripts/country_kpis.py where a country reports there; the storage_* keys
# here are only the fallback. gas_mark / carbon_mark name a key in
# _data/marks.yml, so those tiles stay live.

deu: {gas_mark: ttf, carbon_mark: eua}
fra: {gas_mark: ttf, carbon_mark: eua}
nld: {gas_mark: ttf, carbon_mark: eua}
bel: {gas_mark: ttf, carbon_mark: eua}
ita: {gas_mark: ttf, carbon_mark: eua, gas_tile: "Gas price, TTF (PSV trades at a premium)"}
esp: {gas_mark: ttf, carbon_mark: eua, gas_tile: "Gas price, TTF (MIBGAS is local)"}
dnk: {gas_mark: ttf, carbon_mark: eua}
swe: {gas_mark: ttf, carbon_mark: eua}
nor:
  gas_mark: ttf
  carbon_mark: eua
  storage_label: "Gas storage"
  storage_value: "None"
  storage_note: "Norway is a producer and exporter; it holds no seasonal storage"
fin:
