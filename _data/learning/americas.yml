findings:
  - title: The 10% error waiting for any European practitioner
    detail: >-
      European gas works on a lower-heating-value basis. North American gas is
      priced, sold and custody-metered on higher heating value, and US heat rates
      are quoted the same way. A European spark-spread formula applied unchanged
      inserts a correction factor that does not belong there.
    note: Measured — adding the European 0.9025 factor moved the ERCOT test case from $17.80 to $19.92/MWh, an 11.9% overstatement.
  - title: Same physics, different basis
    detail: >-
      The Europe programme's 0.20196 tCO2/MWh on an LHV basis converts to 53.42
      kg/MMBtu HHV, against EPA's published 53.06. They agree to 0.67%.
    note: The workbook carries that bridge as live formulas and fails the build if the agreement exceeds 1%.
  - title: Gate 0 cleared without a single registration
    detail: >-
      Every blocked data source was probed for a keyless equivalent. EIA's bulk
      archive replaced the keyed API entirely; MISO's failed real-time route was
      replaced by its market-report file server; CAISO only ever needed an unzip step.
    note: EIA publishes its hourly archive as "older than 7 days" — history, not the last week. That caveat is carried in three places so it cannot be lost.
