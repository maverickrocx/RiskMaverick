findings:
  - title: The defect that justified the whole verification standard
    detail: >-
      Batch 1 shipped with no components-versus-total reconciliation. When one was
      finally applied during consolidation, all four markets failed. Germany was out
      by 90,028 GWh — coal sub-classes had been listed alongside their parent class
      and double counted, while three other fuels were omitted entirely.
    note: Root cause — two Eurostat datasets treat pumped hydro oppositely, and one mental model had been applied to both.
  - title: A verification step that cannot fail is worse than none
    detail: >-
      The harness was passing vacuously. LibreOffice was writing its output over its
      own input, so "zero errors" was being measured on a workbook that had never
      been recalculated.
    note: It now asserts every formula carries a cached result before asserting anything about the results.
