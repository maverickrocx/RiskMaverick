<header class="nav">
  <div class="nav-inner">
    <a class="logo" href="{{ '/' | relative_url }}">
      <span class="logo-icon"><img src="{{ '/logo-mark-128.png' | relative_url }}" alt="RiskMaverick"></span>
      <span class="logo-word">Risk<strong>Maverick</strong></span>
    </a>
    <div class="nav-act">
      <button class="icon-btn" data-theme-toggle aria-label="Switch to light mode">
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M20 14a8 8 0 1 1-9.9-9.9A7 7 0 0 0 20 14z"/></svg>
      </button>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
    </div>
    <nav class="nav-links" id="navLinks">
      <div class="nav-item has-mega">
        <a href="{{ '/markets/' | relative_url }}">Markets</a>
        <div class="mega mega-markets">
          {% for m in site.data.markets %}
          <a href="{{ m.url | relative_url }}"><span class="mega-ico"><svg class="ico" aria-hidden="true"><use href="#icon-{{ m.slug }}"></use></svg></span>{{ m.label }}</a>
          {% endfor %}
        </div>
      </div>
      <div class="nav-item has-mega">
        <a href="{{ '/toolkit/' | relative_url }}">Risk Toolkit</a>
        <div class="mega">
          {% for t in site.data.toolkit %}
          <a href="{{ t.url | relative_url }}">{{ t.label }}</a>
          {% endfor %}
        </div>
      </div>
      <a href="{{ '/energy-map/' | relative_url }}">Gas &amp; Power Map</a>
      <a href="{{ '/news/' | relative_url }}">Risk Wire</a>
      <a href="{{ '/insights/' | relative_url }}">Insights</a>
      <a href="{{ '/tools/' | relative_url }}">Tools</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </div>
</header>
