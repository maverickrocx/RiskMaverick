---
layout: default
---
<section class="hero">
  <div class="hero__inner">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.blurb %}<p class="lede">{{ page.blurb }}</p>{% endif %}
  </div>
</section>

<hr class="rule">

<article class="sec--tight">
  <div class="post-body">{{ content }}</div>
</article>
